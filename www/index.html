<style>
:root{--bg:#faf8f5;--fg:#222;--mut:#777;--card:#fff;--bd:#e3ded6;--ac:#2f6f6a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161616;--fg:#e8e6e3;--mut:#999;--card:#202020;--bd:#333;--ac:#6fc0b8}}
:root[data-theme="dark"]{--bg:#161616;--fg:#e8e6e3;--mut:#999;--card:#202020;--bd:#333;--ac:#6fc0b8}
html,body{height:100%;margin:0}body{background:var(--bg);color:var(--fg);font:17px/1.8 "Noto Naskh Arabic",Georgia,serif;display:flex;flex-direction:column}
button,select,input{font:inherit;color:inherit;background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:4px 10px}
button{cursor:pointer}header{display:flex;gap:8px;align-items:center;padding:8px;border-bottom:1px solid var(--bd)}
#st{margin-inline-start:auto;font-size:14px;color:var(--mut)}#st.err{color:#c33}

.row{display:flex;gap:6px;flex-wrap:wrap}.it{padding:6px 8px;border-radius:8px;cursor:pointer}.it:hover,.it.on{background:var(--bd)}.it small{color:var(--mut);display:block}
section{flex:1;display:flex;flex-direction:column;min-width:0}
#tb{display:flex;gap:4px;padding:6px;overflow-x:auto;border-bottom:1px solid var(--bd)}#tb button{min-width:34px}
#ti{font-size:22px;border:0;border-bottom:1px solid var(--bd);border-radius:0;background:transparent;margin:8px 16px 0}
#ed{flex:1;overflow:auto;padding:16px;outline:0;max-width:var(--ew,760px);width:100%;margin:0 auto;box-sizing:border-box;font-family:var(--ef);font-size:var(--es,17px);line-height:var(--el,1.8);background:var(--eb,transparent);caret-color:var(--ac)}#ed h1,#ed h2{color:var(--hc,inherit)}body.notb #tb{display:none}header,aside,#tb,#info{zoom:var(--us,1)}button{min-height:34px}button:hover{border-color:var(--ac)}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac)}.sep{width:1px;background:var(--bd);margin:2px 4px;align-self:stretch;flex:none}#mm{position:fixed;top:calc(env(safe-area-inset-top,0px) + 46px);inset-inline-end:8px;z-index:20;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:6px;display:flex;flex-direction:column;box-shadow:0 8px 30px #0004;min-width:230px}#mm button{text-align:start;border:0;padding:10px 12px;background:transparent}#mm button:hover{background:var(--bd)}#ttl{cursor:pointer}.home{padding:20px;max-width:640px;margin:auto;width:100%;overflow:auto;box-sizing:border-box}.home h2{margin:6px 0}.acts{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.acts button{padding:12px 16px;font-size:16px}.sub{color:var(--mut);font-size:14px;margin:4px 0}.home .card{border:1px solid var(--bd);border-radius:12px;padding:12px;background:var(--card);line-height:1.9}#pal{position:fixed;inset:0;background:#0007;z-index:50;display:flex;justify-content:center;align-items:flex-start;padding-top:12vh}#pal>div{background:var(--card);border:1px solid var(--bd);border-radius:12px;width:min(520px,92vw);padding:8px}#pal input{width:100%;box-sizing:border-box;font-size:18px}.pad{display:grid;grid-template-columns:repeat(3,76px);gap:12px;margin-top:8px}.pad button{height:64px;font-size:24px;border-radius:50%}.dots{display:flex;gap:12px;min-height:20px;font-size:22px}.dots span{width:14px;height:14px;border:2px solid var(--ac);border-radius:50%}.dots span.on{background:var(--ac)}@keyframes sh{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}#lock.shake .dots{animation:sh .35s}#ed h1{color:var(--h1c,var(--hc,inherit))}#ed h2{color:var(--h2c,var(--hc,inherit))}.df{max-height:240px;overflow:auto;font-size:14px}.df .a{background:#2a6f2a40;padding:2px 4px;margin:2px 0}.df .r{background:#a3333340;text-decoration:line-through;padding:2px 4px;margin:2px 0}.mth{cursor:pointer;direction:ltr;unicode-bidi:isolate;display:inline-block}.mth math{font-size:1.15em}figure.m[data-a=l] img{margin-left:0;margin-right:auto}figure.m[data-a=r] img{margin-left:auto;margin-right:0}.pv{margin-top:6px}#ed a{color:var(--ac)}#ed pre{background:var(--bd);padding:8px;border-radius:6px;direction:ltr;text-align:left;overflow-x:auto;font-family:monospace}#ed hr{border:0;border-top:1px solid var(--bd)}body.focus header,body.focus aside,body.focus #tb,body.focus #info{display:none}#lock{position:fixed;inset:0;background:var(--bg);z-index:99;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center}.smp{padding:10px;border:1px solid var(--bd);border-radius:8px;margin:8px 0;font-family:var(--ef);font-size:var(--es,17px);line-height:var(--el,1.8);background:var(--eb,transparent)}
#ed blockquote{border-inline-start:3px solid var(--ac);margin:0;padding-inline-start:12px;color:var(--mut)}
#info{font-size:13px;color:var(--mut);padding:4px 16px}.empty{margin:auto;color:var(--mut)}#ed table{border-collapse:collapse;width:100%;margin:8px 0}#ed td{border:1px solid var(--bd);padding:6px;min-width:40px}.bar{display:flex;gap:6px;padding:6px 16px;flex-wrap:wrap;border-bottom:1px solid var(--bd)}.pnl{padding:8px 16px;overflow:auto;max-height:40%;border-bottom:1px solid var(--bd)}.pnl li{margin:4px 0}.pnl h3{margin:10px 0 2px}figure.m{margin:12px 0;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--card)}figure.m img{max-width:100%;cursor:zoom-in;display:block;margin:auto}figure.m figcaption{font-size:14px;color:var(--mut);text-align:center}.ov{position:fixed;inset:0;background:#000d;display:flex;z-index:9;cursor:zoom-out}.ov img{max-width:100%;max-height:100%;margin:auto}
</style></head><body>
<header><button id="mn" title="المكتبة">☰</button><b id="ttl" title="الرئيسية">مساحة الكتابة</b><button id="bu" style="display:none">💾 نسخ احتياطي</button><button id="gs" style="display:none">⚙</button><button id="bk" style="display:none">📋 التراكمات</button><span id="st">—</span><button id="mb" title="القائمة (Ctrl+K للأوامر)">⋮</button></header>
<main>
<aside id="sb">
<div class="row"><button data-v="all">الكل</button><button data-v="rec">🕘 الأخيرة</button><button data-v="pin">📌 المثبتة</button><button data-v="fav">★ المفضلة</button><button data-v="trash">🗑 المهملات</button></div>
<input id="q" placeholder="بحث (وسم: #وسم)"><select id="so"><option value="u">الأحدث تعديلاً</option><option value="c">الأحدث إنشاءً</option><option value="n">الاسم</option><option value="m">يدوي</option></select><select id="df"><option value="">كل التواريخ</option><option value="1">اليوم</option><option value="7">آخر أسبوع</option><option value="30">آخر شهر</option></select><label><input type="checkbox" id="mo"> بوسائط فقط</label>

<div id="fl"></div><hr style="width:100%;border-color:var(--bd)"><div id="dl"></div>
</aside>
<section id="sec"></section>
</main>
<script>
const $=s=>document.querySelector(s),mk=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e};
let urls=[],db,docs=[],folders=[],cur=null,view='all',fid=null,timer,ed,ti;
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const open=()=>new Promise((ok,no)=>{const r=indexedDB.open('ww',6);r.onupgradeneeded=()=>{['docs','folders','journal','versions','media','chap','ctx','fonts'].forEach(s=>{if(!r.result.objectStoreNames.contains(s))r.result.createObjectStore(s,{keyPath:'id'})});['versions','chap','ctx'].forEach(s=>{const o=r.transaction.objectStore(s);if(!o.indexNames.contains('doc'))o.createIndex('doc','docId')})};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const tx=(st,fn)=>new Promise((ok,no)=>{const t=db.transaction(st,'readwrite');fn(t);t.oncomplete=ok;t.onerror=t.onabort=()=>no(t.error)});
const all=s=>new Promise((ok,no)=>{const r=db.transaction(s).objectStore(s).getAll();r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const put=(s,o)=>tx([s],t=>t.objectStore(s).put(o));
const setS=(t,e)=>{$('#st').textContent=t;$('#st').className=e?'err':''};

async function init(){
 try{db=await open();if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{})}catch(e){setS('التخزين المحلي غير متاح',1);return}
 docs=await all('docs');folders=await all('folders');await loadFonts();
 // استعادة بعد إغلاق مفاجئ: أي مسودة journal أحدث من المستند تُطبَّق
 for(const c of await all('ctx')){(ix[c.docId]=ix[c.docId]||{})[c.id]=c.text;(rx[c.docId]=rx[c.docId]||{})[c.id]=(c.refs||[]).length}
 for(const j of await all('journal')){const d=docs.find(x=>x.id===j.id);
  if(d&&j.ts>d.updated){const k=d.ch?d.ch.indexOf(j.chId):-1;
   if(k>=0){d.title=j.title;d.updated=j.ts;d.ct[k]=ttl(j.html,k);const x2=strip(j.html);await tx(['chap','ctx','docs'],q=>{q.objectStore('chap').put({id:j.chId,docId:d.id,html:j.html});q.objectStore('ctx').put({id:j.chId,docId:d.id,text:x2,refs:refsOf(j.html)});q.objectStore('docs').put(d)});(ix[d.id]=ix[d.id]||{})[j.chId]=x2;setS('تمت استعادة مسودة غير محفوظة')}
   else if(d.ch===undefined&&j.html!==undefined){Object.assign(d,{html:j.html,title:j.title,updated:j.ts});await put('docs',d);setS('تمت استعادة مسودة غير محفوظة')}}
  await tx(['journal'],q=>q.objectStore('journal').delete(j.id))}
 for(const d of docs)if(d.ch===undefined)await putChapters(d,d.html||'');
 const last=localStorage.getItem('ww_last');cur=docs.find(d=>d.id===last&&!d.trashed)||docs.filter(d=>!d.trashed).sort((x,y)=>y.updated-x.updated)[0]||null;
 render();show();
}
const strip=h=>{const d=mk('div');d.innerHTML=h;return d.innerText||d.textContent};

async function save(force){
 if(!cur||!ed||!rdy||(!force&&ev===sv))return;const d=cur,my=ev,k=si,id=d.ch[k],html=clean(),text=ed.innerText,title=ti.value.trim()||'بدون عنوان',tags=tg?tg.value.split(/[,،]/).map(x=>x.trim()).filter(Boolean):(d.tags||[]),pos={si:k,st:ed.scrollTop,co:caretOff()};
 setS('جارٍ الحفظ…');
 for(let i=0;i<3;i++){try{
  await put('journal',{id:d.id,chId:id,html,title,ts:Date.now()});
  const now=Date.now(),snap=force||!d.snapTs||now-d.snapTs>120000,n={...d,title,tags,pos,updated:now,ct:d.ct.slice()},rf=refsOf(html);n.ct[k]=ttl(html,k);if(snap)n.snapTs=now;
  await tx(['docs','chap','ctx','journal','versions'],q=>{q.objectStore('chap').put({id,docId:d.id,html});q.objectStore('ctx').put({id,docId:d.id,text,refs:rf});q.objectStore('docs').put(n);q.objectStore('journal').delete(d.id);if(snap)q.objectStore('versions').put({id:uid(),docId:d.id,chId:id,title:n.ct[k],html,refs:rf,ts:now})});
  Object.assign(d,n);(ix[d.id]=ix[d.id]||{})[id]=text;(rx[d.id]=rx[d.id]||{})[id]=rf.length;sv=my;if(snap)prune(d.id);setS('تم الحفظ ✓');render();return
 }catch(e){await new Promise(r=>setTimeout(r,400*(i+1)))}}
 setS('فشل الحفظ — ستُعاد المحاولة',1);timer=setTimeout(save,3000);
}
const sched=()=>{setS('تعديلات غير محفوظة…');ev++;clearTimeout(timer);timer=setTimeout(save,S.delay||700);cnt()};
const cnt=()=>{const t=ed.innerText.trim();$('#info').textContent=(cur.ch.length>1?'فصل '+(si+1)+'/'+cur.ch.length+' · ':'')+(t?t.split(/\s+/).length:0)+' كلمة · '+t.length+' حرف'};
addEventListener('visibilitychange',()=>{if(document.hidden&&cur){clearTimeout(timer);save()}});
addEventListener('pagehide',()=>{if(cur)save()});

async function patch(d,o){if(d===cur&&ed)await flush();Object.assign(d,o,{updated:Date.now()});await put('docs',d);render();if(d===cur)show()}
async function newDoc(){await flush();const d={id:uid(),title:'مستند جديد',ch:[],ct:[],folderId:fid,fav:false,trashed:false,created:Date.now(),updated:Date.now()};
 await putChapters(d,'');docs.push(d);cur=d;try{localStorage.setItem('ww_last',d.id)}catch(e){}render();show();ti.focus();ti.select()}
async function flush(){if(cur&&ed){clearTimeout(timer);await save()}}
async function openDoc(d){await flush();jump=$('#q').value.trim();cur=d;localStorage.setItem('ww_last',d.id);render();show();if(innerWidth<=700)$('#sb').classList.add('hide')}

function render(){
 document.querySelectorAll('[data-v]').forEach(b=>b.style.borderColor=b.dataset.v===view&&!fid?'var(--ac)':'');
 const fl=$('#fl');fl.textContent='';
 const walk=(p,d)=>folders.filter(f=>(f.parentId||null)===p).sort((a,b)=>(a.ord??0)-(b.ord??0)).forEach(f=>{const e=mk('div','it'+(fid===f.id?' on':''),'📁 '+f.name);e.style.paddingInlineStart=(8+d*14)+'px';e.onclick=()=>{fid=f.id;view='all';render()};fl.append(e);walk(f.id,d+1)});walk(null,0);
 if(fid){const f=folders.find(x=>x.id===fid);if(f){const rn=mk('input'),dx=mk('button','','حذف المجلد');rn.value=f.name;rn.size=10;rn.onchange=async()=>{if(rn.value.trim()){f.name=rn.value.trim();await put('folders',f);render()}};
  dx.onclick=async()=>{if(!dx.dataset.c){dx.dataset.c=1;dx.textContent='تأكيد؟ (المحتويات تنتقل للأعلى)';return}const up=f.parentId||null;for(const d of docs.filter(x=>x.folderId===f.id)){d.folderId=up;await put('docs',d)}for(const g of folders.filter(x=>x.parentId===f.id)){g.parentId=up;await put('folders',g)}await tx(['folders'],q=>q.objectStore('folders').delete(f.id));folders=folders.filter(x=>x!==f);fid=up;render();if(cur)show()};
  const r2=mk('div','row');r2.append(rn,xb('⇧',()=>moveFolder(f,-1)),xb('⇩',()=>moveFolder(f,1)),dx);fl.append(r2)}}
 const q=$('#q').value.trim().toLowerCase(),dl=$('#dl');dl.textContent='';
 docs.filter(d=>view==='trash'?d.trashed:!d.trashed&&(view!=='fav'||d.fav)&&(view!=='pin'||d.pin)&&(!fid||d.folderId===fid||view==='fav'||view==='pin'||view==='rec'))
  .filter(d=>!q||hit(d,q)).filter(d=>!$('#df').value||Date.now()-d.updated<$('#df').value*864e5).filter(d=>!$('#mo').checked||(rx[d.id]&&Object.values(rx[d.id]).some(n=>n))).sort((a,b)=>((view==='all'||fid)?(b.pin|0)-(a.pin|0):0)||($('#so').value==='m'?((a.ord??1e12)-(b.ord??1e12)||b.updated-a.updated):$('#so').value==='n'?a.title.localeCompare(b.title,'ar'):$('#so').value==='c'?b.created-a.created:b.updated-a.updated)).filter((d,i)=>view!=='rec'||i<15)
  .forEach(d=>{const e=mk('div','it'+(cur&&cur.id===d.id?' on':''),(d.pin?'📌 ':'')+(d.fav?'★ ':'')+d.title);e.append(mk('small','',new Date(d.updated).toLocaleString('ar')));e.onclick=()=>openDoc(d);dl.append(e)});
 if(!dl.children.length)dl.append(mk('div','empty','لا توجد مستندات'));
 if(view==='trash'&&docs.some(d=>d.trashed)){const b=mk('button','','حذف المهملات نهائياً');b.onclick=()=>{if(b.dataset.c)purge(docs.filter(d=>d.trashed));else{b.dataset.c=1;b.textContent='اضغط مجدداً للتأكيد — لا رجعة'}};dl.prepend(b)}
}
function show(){urls.splice(0).forEach(u=>URL.revokeObjectURL(u));
 const s=$('#sec');s.textContent='';ed=ti=null;
 if(!cur){home(s);return}
 const fo=secDoc!==cur.id;if(fo){secDoc=cur.id;si=Math.min((cur.pos&&cur.pos.si)||0,cur.ch.length-1)}const jq=jump;jump='';if(jq&&cur.ch.length>1){const q=nrm(jq),k=cur.ch.findIndex(c=>nrm((ix[cur.id]||{})[c]||'').includes(q));if(k>=0)si=k}
 const tb=mk('div');tb.id='tb';
 TL.forEach(([l,c])=>{if((S.hid||[]).includes(c))return;if(SEP.has(c))tb.append(mk('span','sep'));
  const b=mk('button','',l);b.title=TT[c]||'';b.onmousedown=e=>e.preventDefault();b.onclick=()=>{const[x,v]=c.split(':');if(x==='table')return ins();if(x==='find')return findBar();if(x==='hist')return hist();if(x==='media')return pick();if(x==='rec')return rec(b);if(x==='focus')return focusMode(true);if(x==='link')return linkUI();if(x==='math')return mathUI();if(x==='paint')return paint();document.execCommand(x,false,v);sched()};tb.append(b)});
 const sel=mk('select');sel.append(new Option('بدون مجلد',''));folders.forEach(f=>sel.append(new Option(f.name,f.id)));sel.value=cur.folderId||'';sel.onchange=()=>patch(cur,{folderId:sel.value||null});
 const fv=mk('button','',cur.fav?'★':'☆'),pn=xb(cur.pin?'📌':'📍',()=>patch(cur,{pin:!cur.pin})),du=xb('⧉',dupDoc);fv.onclick=()=>patch(cur,{fav:!cur.fav});
 const tr=mk('button','',cur.trashed?'↩ استعادة':'🗑');tr.onclick=async()=>{await flush();await patch(cur,{trashed:!cur.trashed});if(cur.trashed)cur=null;show();render()};
 tb.append(sel,fv,pn,du,xb('⇧',()=>moveDoc(cur,-1)),xb('⇩',()=>moveDoc(cur,1)),tr);if(cur.trashed){const pd=mk('button','','حذف نهائي');pd.onclick=()=>{if(pd.dataset.c)purge([cur]);else{pd.dataset.c=1;pd.textContent='تأكيد؟'}};tb.append(pd)}
 ti=mk('input');ti.id='ti';ti.value=cur.title;ti.dir='auto';ti.oninput=sched;
 ed=mk('div');ed.id='ed';ed.contentEditable=!cur.trashed;ed.dir='auto';ed.oninput=sched;ed.ondragover=e=>e.preventDefault();ed.ondrop=e=>{if(e.dataTransfer&&e.dataTransfer.files.length){e.preventDefault();insMedia([...e.dataTransfer.files])}};
 ed.onpaste=e=>{e.preventDefault();document.execCommand('insertText',false,e.clipboardData.getData('text/plain'))};
 const inf=mk('div');inf.id='info';tg=mk('input');tg.placeholder='وسوم (افصل بفاصلة)';tg.value=(cur.tags||[]).join('، ');tg.oninput=sched;tg.style.cssText='margin:0 16px;font-size:14px';s.append(tb,ti,tg,ed,inf);ed.contentEditable=false;rdy=false;chNav(tb);tools(tb);loadCh(si,fo,jq);
 const ol=mk('select');ol.append(new Option('الفهرس',''));ol.onfocus=ol.onmousedown=()=>{ol.length=1;ed.querySelectorAll('h1,h2').forEach((h,i)=>ol.append(new Option(h.innerText.slice(0,40),i)))};ol.onchange=()=>{const h=ed.querySelectorAll('h1,h2')[ol.value];if(h)h.scrollIntoView({block:'start'});ol.value=''};tb.append(ol);
}
const panel=h=>{let p=$('#pn');if(p)p.remove();p=mk('div','pnl');p.id='pn';const x=mk('button','','✕');x.onclick=()=>p.remove();p.append(x,' ');$('#tb').after(p);return p};
function ins(){ed.focus();document.execCommand('insertHTML',false,'<table>'+('<tr>'+'<td><br></td>'.repeat(3)+'</tr>').repeat(3)+'</table><p><br></p>');sched()}
function findBar(){if($('#fb')){$('#fb').remove();return}
 const b=mk('div','bar');b.id='fb';const f=mk('input'),r=mk('input'),m=mk('span'),cs=mk('input'),rx=mk('input');f.placeholder='بحث';r.placeholder='استبدال';cs.type=rx.type='checkbox';
 const lc=mk('label'),lr=mk('label');lc.append(cs,' حالة');lr.append(rx,' نمط');
 const mkre=g=>{try{return new RegExp(rx.checked?f.value:f.value.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),(g?'g':'')+(cs.checked?'':'i'))}catch(e){m.textContent='نمط غير صالح';return null}};

async function saveBlob(blob,name){
 const dl=window.claude&&await claude.use('downloads');
 if(dl){await dl.save({filename:name,data:blob});return}
 const C=window.Capacitor&&Capacitor.Plugins;
 if(C&&C.Filesystem&&C.Share){const b64=await new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result.split(',')[1]);f.readAsDataURL(blob)});const w=await C.Filesystem.writeFile({path:name,data:b64,directory:'CACHE'});await C.Share.share({title:name,url:w.uri});return}
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000)}
